<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Incidents — Sentinel Edge</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0a0e1a; color:#e2e8f0; min-height:100vh; }
  .header { background:linear-gradient(135deg,#0f172a,#1e1b4b); border-bottom:1px solid #334155; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .logo h1 { font-size:18px; font-weight:700; color:#f1f5f9; }
  .logo p { font-size:11px; color:#94a3b8; }
  .back-btn { background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:8px 16px; border-radius:8px; font-size:13px; text-decoration:none; }
  .container { max-width:1200px; margin:0 auto; padding:24px; }
  .page-title { font-size:22px; font-weight:800; color:#f1f5f9; margin-bottom:6px; }
  .page-sub { font-size:13px; color:#64748b; margin-bottom:24px; }
  .filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-btn { background:#0f172a; border:1px solid #1e293b; color:#94a3b8; padding:6px 14px; border-radius:20px; font-size:12px; cursor:pointer; }
  .filter-btn.active { background:#1e1b4b; border-color:#6366f1; color:#a5b4fc; }
  .search-box { background:#0f172a; border:1px solid #1e293b; color:#e2e8f0; padding:8px 16px; border-radius:8px; font-size:13px; width:100%; margin-bottom:16px; outline:none; }
  .search-box:focus { border-color:#6366f1; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:10px 12px; font-size:11px; color:#64748b; text-transform:uppercase; border-bottom:1px solid #1e293b; }
  td { padding:12px; font-size:13px; border-bottom:1px solid #0f172a; vertical-align:middle; }
  tr:hover td { background:#0f172a; }
  .alert-text { max-width:100%; overflow-wrap:break-word; word-break:break-word; white-space:normal; color:#cbd5e1; }
  .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge-critical { background:#450a0a; color:#f87171; border:1px solid #7f1d1d; }
  .badge-high { background:#431407; color:#fb923c; border:1px solid #7c2d12; }
  .badge-medium { background:#422006; color:#fbbf24; border:1px solid #78350f; }
  .badge-low { background:#052e16; color:#4ade80; border:1px solid #14532d; }
  .badge-pending { background:#1e1b4b; color:#a5b4fc; border:1px solid #312e81; }
  .badge-executed { background:#052e16; color:#4ade80; border:1px solid #14532d; }
  .view-btn { background:#0c1a2e; border:1px solid #0369a1; color:#38bdf8; padding:4px 10px; border-radius:6px; font-size:12px; text-decoration:none; }
  .approve-btn { background:#052e16; border:1px solid #16a34a; color:#4ade80; padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; margin-left:4px; }
  .approve-btn:hover { background:#16a34a; color:white; }
  .stats-row { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { background:#0f172a; border:1px solid #1e293b; border-radius:8px; padding:12px 16px; }
  .stat-val { font-size:22px; font-weight:800; }
  .stat-lbl { font-size:11px; color:#64748b; }
  .load-more { display:block; width:100%; background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:12px; border-radius:8px; font-size:13px; cursor:pointer; margin-top:16px; text-align:center; }
  .load-more:hover { border-color:#6366f1; color:#a5b4fc; }
  .empty { text-align:center; padding:40px; color:#475569; }

  * { box-sizing: border-box; }
  p, li, td, th, div, span { overflow-wrap: break-word; word-break: break-word; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-icon">📋</div>
    <div><h1>Sentinel Edge</h1><p>All Incidents</p></div>
  </div>
  <a href="/" class="back-btn">← Dashboard</a>
</div>

<div class="container">
  <div class="page-title">📋 All Incidents</div>
  <div class="page-sub" id="sub-text">Loading...</div>

  <div class="stats-row">
    <div class="stat"><div class="stat-val" style="color:#f87171" id="s-total">--</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val" style="color:#fbbf24" id="s-pending">--</div><div class="stat-lbl">Pending</div></div>
    <div class="stat"><div class="stat-val" style="color:#4ade80" id="s-executed">--</div><div class="stat-lbl">Executed</div></div>
    <div class="stat"><div class="stat-val" style="color:#f87171" id="s-critical">--</div><div class="stat-lbl">Critical</div></div>
  </div>

  <input class="search-box" id="search" placeholder="Search incidents..." oninput="filterTable()">

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('executed',this)">Executed</button>
    <button class="filter-btn" onclick="setFilter('critical',this)">Critical</button>
    <button class="filter-btn" onclick="setFilter('high',this)">High</button>
    <button class="filter-btn" onclick="setFilter('medium',this)">Medium</button>
  </div>

  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Alert</th>
          <th>Type</th>
          <th>Severity</th>
          <th>Status</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="incidents-tbody">
        <tr><td colspan="7" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <button class="load-more" id="load-more-btn" onclick="loadMore()" style="display:none">Load More Incidents</button>
</div>

<script>
let allIncidents = [];
let currentFilter = 'all';
let currentSearch = '';
let shown = 50;

function getSev(analysis) {
  try { return JSON.parse(analysis).severity || 'low'; } catch { return 'low'; }
}
function getType(analysis) {
  try { return JSON.parse(analysis).threat_type || 'unknown'; } catch { return 'unknown'; }
}

async function loadAll() {
  const r = await fetch('/incidents?limit=500');
  allIncidents = await r.json();
  updateStats();
  render();
}

function updateStats() {
  document.getElementById('s-total').textContent = allIncidents.length;
  document.getElementById('s-pending').textContent = allIncidents.filter(i => i.status === 'pending').length;
  document.getElementById('s-executed').textContent = allIncidents.filter(i => i.status === 'executed').length;
  document.getElementById('s-critical').textContent = allIncidents.filter(i => getSev(i.analysis) === 'critical').length;
  document.getElementById('sub-text').textContent = `${allIncidents.length} total incidents — click View Chain to see full AI reasoning`;
}

function getFiltered() {
  return allIncidents.filter(i => {
    const sev = getSev(i.analysis);
    const matchFilter = currentFilter === 'all' || i.status === currentFilter || sev === currentFilter;
    const matchSearch = !currentSearch || i.alert_type.toLowerCase().includes(currentSearch.toLowerCase()) || getType(i.analysis).includes(currentSearch.toLowerCase());
    return matchFilter && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const toShow = filtered.slice(0, shown);
  const tbody = document.getElementById('incidents-tbody');

  if (toShow.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No incidents match your filter</td></tr>';
    document.getElementById('load-more-btn').style.display = 'none';
    return;
  }

  tbody.innerHTML = toShow.map(i => {
    const sev = getSev(i.analysis);
    const type = getType(i.analysis).replace(/_/g,' ');
    const time = i.timestamp ? i.timestamp.substring(0,16).replace('T',' ') : '--';
    const approveBtn = i.status === 'pending' ? `<button class="approve-btn" onclick="approve(${i.id},this)">Approve</button>` : '';
    return `<tr>
      <td style="color:#64748b;font-family:monospace">#${i.id}</td>
      <td><div class="alert-text" title="${i.alert_type}">${i.alert_type}</div><div style="font-size:11px;color:#475569;margin-top:2px">${type}</div></td>
      <td style="font-size:11px;color:#64748b">${type}</td>
      <td><span class="badge badge-${sev}">${sev}</span></td>
      <td><span class="badge badge-${i.status}">${i.status}</span></td>
      <td style="font-size:11px;color:#64748b">${time}</td>
      <td><a class="view-btn" href="/chain/view/${i.id}">View Chain</a>${approveBtn}</td>
    </tr>`;
  }).join('');

  document.getElementById('load-more-btn').style.display = filtered.length > shown ? 'block' : 'none';
  document.getElementById('load-more-btn').textContent = `Load More (${filtered.length - shown} remaining)`;
}

function setFilter(f, btn) {
  currentFilter = f;
  shown = 50;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filterTable() {
  currentSearch = document.getElementById('search').value;
  shown = 50;
  render();
}

function loadMore() {
  shown += 50;
  render();
}

async function approve(id, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  const r = await fetch(`/approve/${id}`, {method:'POST'});
  const d = await r.json();
  if (d.status === 'executed') {
    btn.outerHTML = '<span style="color:#4ade80;font-size:12px">✓ Done</span>';
    loadAll();
  } else {
    btn.disabled = false;
    btn.textContent = 'Approve';
  }
}

loadAll();
</script>
</body>
</html>
